<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería Interactiva Moderna</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Objeto en movimiento: bola flotante animada -->
    <div class="floating-orb"></div>
    
    <header>
        <h1 id="main-title">Galería Creativa</h1>
        <p class="subtitle">Explora, interactúa y descubre</p>
    </header>

    <main>
        <!-- Sección de campo de texto -->
        <section class="text-section">
            <div class="input-container">
                <label for="userInput">Personaliza el título:</label>
                <input type="text" id="userInput" placeholder="Escribe algo aquí...">
                <button id="changeTextBtn">Cambiar Título</button>
            </div>
        </section>

        <!-- Sección de galería con intercambio de imágenes -->
        <section class="gallery-section">
            <h2>Galería Interactiva</h2>
            <p class="gallery-info">Haz clic en las imágenes para cambiarlas</p>
            
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1579546929518-9e396f3cc809?w=500&h=500&fit=crop" 
                         alt="Imagen abstracta 1" 
                         class="clickable-image"
                         data-alt-src="https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=500&h=500&fit=crop">
                    <p class="image-label">Abstracto 1</p>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1550684376-efcbd6e3f031?w=500&h=500&fit=crop" 
                         alt="Imagen abstracta 2" 
                         class="clickable-image"
                         data-alt-src="https://images.unsplash.com/photo-1558591710-4b4a1ae0f04d?w=500&h=500&fit=crop">
                    <p class="image-label">Abstracto 2</p>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1567359781514-3b964e2b04d6?w=500&h=500&fit=crop" 
                         alt="Imagen abstracta 3" 
                         class="clickable-image"
                         data-alt-src="https://images.unsplash.com/photo-1553356084-58ef4a67b2a7?w=500&h=500&fit=crop">
                    <p class="image-label">Abstracto 3</p>
                </div>

                <div class="gallery-item">
                    <img src="https://images.unsplash.com/photo-1541701494587-cb58502866ab?w=500&h=500&fit=crop" 
                         alt="Imagen abstracta 4" 
                         class="clickable-image"
                         data-alt-src="https://images.unsplash.com/photo-1506792006437-256b665541e2?w=500&h=500&fit=crop">
                    <p class="image-label">Abstracto 4</p>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Galería Creativa</p>
        <p class="license">
            Contenido bajo licencia 
            <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="license">
                CC BY-SA 4.0
            </a>
            <br>
            <small>Imágenes de <a href="https://unsplash.com" target="_blank">Unsplash</a> (Licencia Unsplash)</small>
        </p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
